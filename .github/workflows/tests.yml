name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: First launch installs missing runtime tools
        run: |
          scratch=$(mktemp -d)
          trap 'rm -rf -- "$scratch"' EXIT
          printf 'SERVER_ID=bootstrap-test\nREMOTE=fixture:backups\nSTATE_DIR=%s/state\napp sample %s\n' "$scratch" "$scratch" > "$scratch/settings"
          sudo bash backup.sh plan --config "$scratch/settings"
          command -v rclone
          command -v jq
          test ! -e "$scratch/state"
      - name: Shell syntax and style
        run: |
          bash -n backup.sh
          bash -n lib/common.sh
          bash -n lib/backup.sh
          shellcheck -x backup.sh stats.sh tests/backup.sh
          bash backup.sh --help
          if bash backup.sh --config; then exit 1; fi
      - name: Backup and recovery with a real local rclone remote
        run: bash tests/backup.sh
      - name: Notification design and independent destinations
        run: node --test tests/test_notifications.cjs
